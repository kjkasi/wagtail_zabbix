{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<main>
    <h1>Sign in</h1>
    {% if form.errors %}
        <p>Your username and password did not match. Please try again.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Sign in</button>
    </form>
</main>
{% endblock %}
